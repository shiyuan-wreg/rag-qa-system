services:
  rag:
    build:
      context: ..
      dockerfile: backends/rag_app/Dockerfile
    env_file: ../.env
    restart: always
    expose: ["8001"]

  fc:
    build:
      context: ..
      dockerfile: backends/fc_app/Dockerfile
    env_file: ../.env
    restart: always
    expose: ["8002"]

  nexus:
    build:
      context: ..
      dockerfile: backends/nexus_app/Dockerfile
    env_file: ../.env
    restart: always
    expose: ["8003"]
    depends_on: [rag, fc]

  md_converter:
    build:
      context: ..
      dockerfile: backends/md_converter_app/Dockerfile
    env_file: ../.env
    restart: always
    expose: ["8004"]
    volumes:
      - ../backends/md_converter_app/output:/app/output
      - ../backends/md_converter_app/uploads:/app/uploads

  iconforge:
    build:
      context: ..
      dockerfile: backends/iconforge_app/Dockerfile
    env_file: ../.env
    restart: always
    expose: ["8005"]

  biliseance:
    build:
      context: ..
      dockerfile: backends/biliseance_app/Dockerfile
    env_file: ../.env
    restart: always
    expose: ["8006"]
    depends_on: [mihomo]
    environment:
      # 服务器机房 IP 被 archive.org 拉黑,必须经住宅代理出口
      - HTTP_PROXY=http://mihomo:7890
      - HTTPS_PROXY=http://mihomo:7890

  # mihomo(Clash 内核)出站代理:仅 biliseance 使用;订阅配置在 deploy/mihomo/config.yaml(gitignored)
  mihomo:
    image: metacubex/mihomo:v1.18.7
    restart: always
    expose: ["7890"]
    volumes:
      - ./mihomo/config.yaml:/root/.config/mihomo/config.yaml:ro

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    restart: always
    depends_on: [rag, fc, nexus, md_converter, iconforge, biliseance]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ../frontends/portfolio/dist:/usr/share/nginx/html:ro
      - ../frontends/nexus-learning-web/dist:/usr/share/nginx/learn:ro

  certbot:
    image: certbot/certbot:latest
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/lib/letsencrypt:/var/lib/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    restart: always

  # lab-terminal 实验网关：读者在书页点「跑一下」→ 白名单实验在一次性容器里真跑
  # 挂载 docker.sock = 网关持有宿主机 root 级能力，安全性依赖网关的口令+白名单设计
  lab:
    build:
      context: ../lab-terminal
      dockerfile: gateway/Dockerfile
    env_file: ../.env
    restart: always
    expose: ["8090"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../lab-terminal/data:/data
