# mihomo (Clash 内核) 容器配置示例。
# 生产真实配置在服务器 deploy/mihomo/config.yaml(gitignored,含订阅链接,不入库)。
# 部署时用服务器 .env 里的 MIHOMO_SUB_URL 替换 __SUB_URL__ 生成真实配置。
mixed-port: 7890
allow-lan: true
bind-address: "*"
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090

proxy-providers:
  airport:
    type: http
    url: "__SUB_URL__"
    interval: 86400
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: PROXY
    type: select
    use: [airport]

rules:
  - MATCH,PROXY
